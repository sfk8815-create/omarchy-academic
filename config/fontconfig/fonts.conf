<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 泛用字体族：思源黑体作为“弱绑定”回退排在拉丁主字体之后。
       拉丁字形由排在前面的强绑定字体覆盖，完全不受影响；
       只有中文缺字时才落到思源黑体 (Noto Sans CJK SC)。 -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono CJK SC</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <!-- system-ui / -apple-system 等已被系统规则解析为 Liberation Sans，
       给它也挂上同样的中文回退，覆盖 Chromium/Electron 界面。 -->
  <alias>
    <family>Liberation Sans</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>

  <!-- JetBrainsMono 系列（alacritty/kitty/ghostty 等终端主字体）：
       用 accept 把思源黑体挂到回退链末尾。accept 只在原字体缺字时才启用，
       所以英文/数字仍用 JetBrainsMono，只有中文落到思源黑体。
       foot 已在 font 行显式指定回退，此规则对它是冗余但无害的。 -->
  <alias>
    <family>JetBrainsMono Nerd Font</family>
    <accept>
      <family>Noto Sans CJK SC</family>
    </accept>
  </alias>

  <!-- 带中文语言标记 (lang 含 zh) 的模式：把思源黑体弱绑定加进回退链。
       弱绑定优先度低于强绑定的原字体，所以英文/数字仍用原字体，
       只有原字体覆盖不了的中文字形才使用思源黑体。 -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <edit name="family" mode="prepend" binding="weak">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
</fontconfig>
